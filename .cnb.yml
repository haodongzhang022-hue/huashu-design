main:
  push:
    - services:
        - docker
      stages:
        - name: Docker build
          script: docker build -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest .
        - name: Docker push
          script: docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest

master:
  push:
    # 打包 skill 主体内容为 zip，发布到稳定 tag Release（skill-latest）供用户直接下载
    - name: package-skill-zip
      docker:
        # 使用仓库自身镜像（node:22-slim + git/curl/jq/zip/cnb-cli）
        image: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
      stages:
        - name: 打包 skill 并发布到 Release
          script: bash scripts/release-zip.sh

.npc_task: &npc_task
  - docker:
      image: ${CNB_DOCKER_REGISTRY}/${CNB_NPC_SLUG_LOWERCASE}:latest
    stages:
      - name: npc go
        type: npc:go

$:
  issue.comment@npc: *npc_task
  pull_request.comment@npc: *npc_task
