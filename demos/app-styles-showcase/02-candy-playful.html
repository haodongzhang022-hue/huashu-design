<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<title>02 · 糖果圆角游戏化 Candy-Playful · 习惯追踪App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh;
    background: #E8E4DC;
    display: flex; align-items: center; justify-content: center;
    font-family: "Nunito", sans-serif;
    padding: 40px 20px;
  }
  .label {
    position: fixed; top: 24px; left: 24px;
    font-family: ui-monospace, monospace;
    font-size: 11px; letter-spacing: .15em;
    color: #8B867E; text-transform: uppercase;
  }
  .phone {
    width: 393px; height: 852px;
    background: #FFF7E6;
    border-radius: 54px;
    box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #3a3a3a, 0 30px 80px rgba(0,0,0,.3);
    overflow: hidden;
    position: relative;
    color: #4B3A2F;
  }
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 54px; padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 700; font-size: 15px; z-index: 10;
  }
  .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 32px; background: #1a1a1a; border-radius: 20px; z-index: 11;
  }
  .screen { padding: 70px 20px 30px; height: 100%; overflow: hidden; position: relative; }

  .mascot-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .mascot {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #FFC94D 0%, #FF9F43 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 4px 0 #D97E1F;
    border: 3px solid #fff;
  }
  .hello { font-family: "Baloo 2", cursive; font-size: 24px; font-weight: 800; line-height: 1.1; }
  .hello small { display: block; font-size: 13px; font-weight: 700; color: #A98A6F; font-family: "Nunito"; }

  .streak-banner {
    background: linear-gradient(135deg, #FF6B9D 0%, #FF8E53 100%);
    border-radius: 24px;
    padding: 18px 20px;
    color: #fff;
    display: flex; align-items: center; gap: 14px;
    box-shadow: 0 6px 0 #D94F70;
    margin-bottom: 18px;
    border: 3px solid #fff;
  }
  .flame { font-size: 40px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.15)); }
  .streak-num { font-family: "Baloo 2"; font-size: 34px; font-weight: 800; line-height: 1; }
  .streak-txt { font-size: 12px; font-weight: 800; opacity: .95; letter-spacing: .05em; }

  .section-title {
    font-family: "Baloo 2"; font-size: 18px; font-weight: 800;
    margin: 6px 4px 12px; color: #4B3A2F;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .section-title span { font-family: "Nunito"; font-size: 12px; color: #A98A6F; font-weight: 700; }

  .habit-card {
    background: #fff;
    border-radius: 20px;
    padding: 14px 16px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: 0 4px 0 #EFE3D0;
    border: 2px solid #F5E9D3;
  }
  .habit-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .i-water { background: #D6F0FF; box-shadow: 0 3px 0 #A8D9F5; }
  .i-book  { background: #FFE3EC; box-shadow: 0 3px 0 #F5B8CD; }
  .i-run   { background: #DFF7E3; box-shadow: 0 3px 0 #AEE6BB; }
  .habit-info { flex: 1; min-width: 0; }
  .habit-name { font-weight: 800; font-size: 15px; }
  .habit-sub  { font-size: 12px; color: #A98A6F; font-weight: 700; }
  .progress-bar {
    height: 8px; background: #F0E6D2; border-radius: 99px;
    margin-top: 6px; overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 99px; }
  .pf-water { width: 75%; background: linear-gradient(90deg,#4FC3F7,#2196F3); }
  .pf-book  { width: 40%; background: linear-gradient(90deg,#F48FB1,#E91E63); }
  .pf-run   { width: 100%; background: linear-gradient(90deg,#81C784,#4CAF50); }

  .check-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid #E5D5BB; background: #FFF7E6;
    color: transparent; font-size: 16px; font-weight: 900;
    cursor: pointer; flex-shrink: 0;
    transition: all .15s;
  }
  .check-btn.done {
    background: #58CC02; border-color: #46A302; color: #fff;
    box-shadow: 0 3px 0 #3E8E02;
  }

  .cta {
    position: absolute; left: 20px; right: 20px; bottom: 32px;
    background: #58CC02; color: #fff;
    font-family: "Baloo 2"; font-size: 17px; font-weight: 800;
    letter-spacing: .1em;
    border: none; border-radius: 18px;
    padding: 16px;
    box-shadow: 0 5px 0 #46A302;
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    text-transform: uppercase;
  }
  .cta:active { transform: translateY(5px); box-shadow: 0 0 0 #46A302; }
</style>
</head>
<body>
<div class="label">02 · CANDY-PLAYFUL · 大胆派 · 还原度 92%</div>
<div class="phone">
  <div class="island"></div>
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="screen">
    <div class="mascot-row">
      <div class="mascot">🦉</div>
      <div class="hello">早安，花生！<small>今天也要元气满满 ✨</small></div>
    </div>

    <div class="streak-banner">
      <div class="flame">🔥</div>
      <div>
        <div class="streak-num">14 天</div>
        <div class="streak-txt">连续打卡 · 超越 92% 用户</div>
      </div>
    </div>

    <div class="section-title">今日习惯 <span>3/5 已完成</span></div>

    <div class="habit-card">
      <div class="habit-icon i-water">💧</div>
      <div class="habit-info">
        <div class="habit-name">喝 8 杯水</div>
        <div class="habit-sub">6/8 杯 · 还差 2 杯</div>
        <div class="progress-bar"><div class="progress-fill pf-water"></div></div>
      </div>
      <button class="check-btn">✓</button>
    </div>

    <div class="habit-card">
      <div class="habit-icon i-book">📖</div>
      <div class="habit-info">
        <div class="habit-name">阅读 30 分钟</div>
        <div class="habit-sub">12/30 分钟</div>
        <div class="progress-bar"><div class="progress-fill pf-book"></div></div>
      </div>
      <button class="check-btn">✓</button>
    </div>

    <div class="habit-card">
      <div class="habit-icon i-run">🏃</div>
      <div class="habit-info">
        <div class="habit-name">晨跑 3 公里</div>
        <div class="habit-sub">已完成 · +20 XP</div>
        <div class="progress-bar"><div class="progress-fill pf-run"></div></div>
      </div>
      <button class="check-btn done">✓</button>
    </div>

    <button class="cta">打卡领奖励 🎁</button>
  </div>
</div>
</body>
</html>
